# Generates listening clips with VOICEVOX. See "Generating more clips" in README.md.
services:
  voicevox:
    image: voicevox/voicevox_engine:cpu-0.25.2
    restart: unless-stopped
    environment:
      # Synthesis threads; set VV_THREADS to your CPU core count.
      VV_CPU_NUM_THREADS: ${VV_THREADS:-4}

  app:
    image: python:3.13-slim
    restart: unless-stopped
    command: ["python", "-u", "/app/server.py"]
    working_dir: /app
    environment:
      VOICEVOX_URL: http://voicevox:50021
      # VOICEVOX style ids: 2 四国めたん, 8 春日部つむぎ, 11 玄野武宏, 13 青山龍星
      VOICES: "2,8,11,13"
      CACHE_DIR: /cache
      # Pre-generate clips in the background until the cache holds this many.
      STOCK_CAP: ${STOCK_CAP:-20000}
    volumes:
      - ./:/app:ro
      - ./cache:/cache
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      - voicevox
